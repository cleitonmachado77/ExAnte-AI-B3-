alpha_max: 0.6
# α da PDD fora do setor financeiro (Pesos_Alpha_Beta §3): em não-financeiras a
# PDD é pequena e pouco "automatizável"; bancos/financeiras usam alpha_base.pdd.
# null → mesmo α para todos.
alpha_pdd_nao_financeiro: 0.15
# Pessoal (DVA 7.08.01) já está dentro de CPV + SG&A + Vendas.
#   liquido  → retira de CPV/SG&A/Vendas (pro rata) a parcela de pessoal e aplica
#              α_pessoal apenas sobre Pessoal (sem dupla contagem)   [padrão]
#   separado → soma como linhas independentes (versão antiga; superestima ~25%)
#   excluir  → ignora a linha Pessoal
pessoal_modo: liquido
f_caixa:
- max_exclusive: 0.03
  valor: 0.75
- max_exclusive: 0.08
  valor: 0.9
- max_exclusive: null
  valor: 1.0
g_alavancagem:
- max_exclusive: 2.0
  valor: 1.0
- max_exclusive: 3.5
  valor: 0.7
- max_exclusive: null
  valor: 0.4
g_ebitda_negativo: 0.25
# Instituições financeiras: DL/EBITDA não é uma métrica definida (captação via
# depósitos, sem EBITDA); g fixo, só f(caixa/ativo) diferencia.
g_financeiro: 1.0
# h(FCO/ROL): geração de caixa operacional (DFC 6.01). Empresa que queima caixa
# tem menos folga para investir em IA mesmo com caixa em balanço. Sem DFC → 1,0.
usar_fco: true
h_fco:
- max_exclusive: 0.0
  valor: 0.85
- max_exclusive: null
  valor: 1.0
min_receita: 50000000.0
max_linha_sobre_receita: 3.0
excluir_recuperacao_judicial: true
exigir_ao_menos_uma_de:
- sga
- vendas
- pessoal
usar_consolidado: true
# companhias sem consolidado (sem controladas) entram pela demonstração individual
fallback_individual: true
# Subsidiárias/SPEs: entram pela individual E são "Categoria B" na CVM (não podem
# ter ações em bolsa) — malhas da Rumo, concessionárias etc. Ficam fora do painel
# para não contar controlada + holding.
excluir_individual_categoria_b: true
# Universo estrito de emissoras de ações (Categoria A). Desligado: mantém
# companhias só com dívida listada (Categoria B com consolidado).
apenas_categoria_a: false
# Excluir empresas com DRE inconsistente com a DVA (alerta_receita). Desligado:
# só sinaliza; a winsorização já limita o efeito no score.
excluir_alerta_receita: false
# Setor: SETOR_ATIV do cadastro CVM (config/setor_cvm.yaml) antes da heurística por nome
usar_setor_cvm: true
normalizar_score_0_100: true
# Exposição usada no score relativo é truncada neste percentil do painel válido
# (o teto em R$ não muda). null → sem winsorização.
winsor_exposicao_pct: 0.99
# minmax (padrão) | percentil
normalizacao_score: minmax
rho_captura: 0.7
phi_execucao_base: 0.85
lambda_ready: 0.1
w_software: 0.5
w_intangivel: 0.2
w_ped: 0.3
# Readiness: razões Soft/Ativo e Intang/Ativo são < 0,05 na maioria das empresas,
# então clip(r,0,1) deixa o Bloco C inerte. Modos:
#   percentil → posição relativa no painel válido (0–1)   [padrão]
#   escala    → r / quantil de referência, clip 0–1
#   bruto     → clip(r, 0, 1)
readiness_modo: percentil
readiness_quantil_ref: 0.9
